name: Seqwenser iOS (build, test, screenshots)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  core-linux:
    name: C++ engine + Swift kit tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests (CMake, no JUCE)
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cmake -S . -B build-core -G Ninja -DCMAKE_BUILD_TYPE=Release -DMANGLE_BUILD_PLUGIN=OFF -DMANGLE_BUILD_TESTS=ON
          cmake --build build-core
          ctest --test-dir build-core --output-on-failure

  ios:
    name: iOS simulator build + tests + screenshots
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (XcodeGen writes a newer project format than Xcode 15.4 reads)
        run: |
          find /Applications -maxdepth 1 -name 'Xcode*.app'
          X=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi

      - name: Tools
        run: |
          sw_vers; xcodebuild -version; swift --version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Swift package tests (macOS host)
        run: swift test

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec App/project.yml --project App
          grep objectVersion App/Seqwenser.xcodeproj/project.pbxproj

      - name: Pick an iPhone simulator
        id: sim
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(k,v) for k,vs in d.items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")]
          pref=[v for k,v in c if "Pro" in v["name"] and "Max" not in v["name"]] or [v for k,v in c]
          print(pref[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project App/Seqwenser.xcodeproj -scheme Seqwenser \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO | tee build.log | tail -40

      - name: App unit tests (simulator)
        run: |
          set -o pipefail
          xcodebuild test-without-building -project App/Seqwenser.xcodeproj -scheme Seqwenser \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd -resultBundlePath build/tests.xcresult CODE_SIGNING_ALLOWED=NO | tee test.log | tail -60

      - name: Screenshots from the simulator
        run: scripts/ci_screenshots.sh "${{ steps.sim.outputs.udid }}" "$(find build/dd/Build/Products -name Seqwenser.app -maxdepth 2 | head -1)" screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seqwenser-screenshots
          path: screenshots/*.png
          if-no-files-found: warn

      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seqwenser-ios-logs
          path: |
            build.log
            test.log
            build/tests.xcresult
          if-no-files-found: ignore

      - name: Zip unsigned simulator app
        run: |
          cd "$(dirname "$(find build/dd/Build/Products -name Seqwenser.app -maxdepth 2 | head -1)")" && zip -qr "$GITHUB_WORKSPACE/Seqwenser-simulator.app.zip" Seqwenser.app
      - uses: actions/upload-artifact@v4
        with:
          name: seqwenser-simulator-app
          path: Seqwenser-simulator.app.zip
